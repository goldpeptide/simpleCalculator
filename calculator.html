<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic calculator</title>
    <script src="calculator.js" defer></script>
    <link rel="stylesheet" href='calculator.css'>
</head>

<body>
    <div id="container">
        <div><input type="text" value="0" id="display" inputmode=""></div>

    <div class="column">
        <div><button id="clear"> AC </button></div>
        <div><button class='operators' id='equal'> = </button></div>
        <div><button class='operators' id="plus"> + </button></div>
        <div><button class='operators' id='minus'> - </button></div>
    </div>

    <div class="column">
        <div><button class='operators' id="multiply"> × </button></div>
        <div><button class='operators' id="divide"> ÷ </button></div>
        
        <div><button class='digits'> 0 </button></div>
        <div><button class='digits'> 1 </button></div>
    </div>

    <div class="column">
        <div><button class='digits'> 2 </button></div>
        <div><button class='digits'> 3 </button></div>
        <div><button class='digits'> 4 </button></div>
        <div><button class='digits'> 5 </button></div>
    </div>

    <div class="column">
        <div><button class='digits'> 6 </button></div>
        <div><button class='digits'> 7 </button></div>
        <div><button class='digits'> 8 </button></div>
        <div><button class='digits'> 9 </button></div>
    </div>   
    </div>
    
</body>
</html>
